# Prometheus additionalScrapeConfigs — GLerp site auto-discovery.
#
# These scrape jobs use Kubernetes Service discovery to automatically find
# GLerp sites. When a new site is deployed, simply adding one label and one
# annotation to its Kubernetes Service is enough — no per-site CRD or script
# is required. Prometheus discovers the new target within one scrape interval.
#
# HOW TO ADD MONITORING TO A NEW GLERP SITE:
#   Add these to the site's primary Service in the Helm chart values:
#
#     labels:
#       glerp-monitoring: "enabled"          ← triggers Prometheus discovery
#     annotations:
#       glerp-monitoring/public-url: "https://<company>.greenllama.tech"
#
#   That is all. Prometheus picks up the new site within ~60 seconds.
#
# TO APPLY THIS CONFIG TO RANCHER MONITORING:
#   Option A — Apply this Secret and reference it in Prometheus values:
#     kubectl apply -f manifests/prometheus/additional-scrape-configs-secret.yaml
#     Then in Rancher Monitoring values set:
#       prometheus.prometheusSpec.additionalScrapeConfigsSecret.name: glerp-additional-scrape-configs
#       prometheus.prometheusSpec.additionalScrapeConfigsSecret.key: scrape-configs.yaml
#
#   Option B — Paste the content of the scrape-configs.yaml key directly into
#     Rancher Monitoring → Edit → prometheus.prometheusSpec.additionalScrapeConfigs
#     (inline YAML — see docs/deployment-guide.md for the exact Rancher UI steps)
#
# NOTE: Prometheus needs cluster-level read access to Services. This is already
# granted by the rancher-monitoring ClusterRole — no extra RBAC required.
---
apiVersion: v1
kind: Secret
metadata:
  name: glerp-additional-scrape-configs
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/name: glerp-monitoring
type: Opaque
stringData:
  scrape-configs.yaml: |
    # ── Tier 1: Basic HTTPS reachability (fast 200 OK check) ──────────────────
    # Fires GLerpSiteDown alert after 2 min of failure.
    - job_name: 'glerp-sites-basic'
      scrape_interval: 60s
      scrape_timeout: 15s
      metrics_path: /probe
      params:
        module: [http_2xx]
      kubernetes_sd_configs:
        - role: service
      relabel_configs:
        # Only include Services labeled glerp-monitoring=enabled
        - source_labels: [__meta_kubernetes_service_label_glerp_monitoring]
          action: keep
          regex: enabled
        # Read the public URL from annotation (e.g. https://mcdonalds.greenllama.tech)
        # and append /login as the probe target
        - source_labels: [__meta_kubernetes_service_annotation_glerp_monitoring_public_url]
          action: replace
          regex: (.+)
          replacement: '${1}/login'
          target_label: __param_target
        # Drop services with no public-url annotation
        - source_labels: [__param_target]
          action: drop
          regex: '/login'
        - source_labels: [__param_target]
          target_label: instance
        # Route all probes through Blackbox Exporter
        - target_label: __address__
          replacement: 'glerp-blackbox-prometheus-blackbox-exporter.cattle-monitoring-system.svc.cluster.local:9115'
        # Carry namespace as site label (used in all alert expressions and dashboards)
        - source_labels: [__meta_kubernetes_namespace]
          target_label: site
        - target_label: probe_tier
          replacement: basic

    # ── Tier 2: Login page content validation (canonical SLA signal) ───────────
    # Checks that Frappe v16 login page has proper HTML — detects backend degraded state.
    # Fires GLerpSiteDegraded alert after 5 min of failure.
    - job_name: 'glerp-sites-login'
      scrape_interval: 60s
      scrape_timeout: 15s
      metrics_path: /probe
      params:
        module: [http_glerp_login]
      kubernetes_sd_configs:
        - role: service
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_label_glerp_monitoring]
          action: keep
          regex: enabled
        - source_labels: [__meta_kubernetes_service_annotation_glerp_monitoring_public_url]
          action: replace
          regex: (.+)
          replacement: '${1}/login'
          target_label: __param_target
        - source_labels: [__param_target]
          action: drop
          regex: '/login'
        - source_labels: [__param_target]
          target_label: instance
        - target_label: __address__
          replacement: 'glerp-blackbox-prometheus-blackbox-exporter.cattle-monitoring-system.svc.cluster.local:9115'
        - source_labels: [__meta_kubernetes_namespace]
          target_label: site
        - target_label: probe_tier
          replacement: login

    # ── Internal Frappe worker health (diagnostic only, not SLA signal) ────────
    # Probes /api/method/ping on the labeled Service directly (bypasses Nginx/TLS).
    # Not used for alerts or SLA — useful for diagnosing "Nginx up, Frappe down" state.
    # Probe interval is 2 minutes (less frequent — internal only).
    - job_name: 'glerp-sites-internal'
      scrape_interval: 120s
      scrape_timeout: 10s
      metrics_path: /probe
      params:
        module: [http_2xx_internal]
      kubernetes_sd_configs:
        - role: service
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_label_glerp_monitoring]
          action: keep
          regex: enabled
        # Construct internal URL from service name + namespace:
        # http://<service-name>.<namespace>.svc.cluster.local/api/method/ping
        - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_namespace]
          action: replace
          regex: (.+);(.+)
          replacement: 'http://${1}.${2}.svc.cluster.local/api/method/ping'
          target_label: __param_target
        - source_labels: [__param_target]
          target_label: instance
        - target_label: __address__
          replacement: 'glerp-blackbox-prometheus-blackbox-exporter.cattle-monitoring-system.svc.cluster.local:9115'
        - source_labels: [__meta_kubernetes_namespace]
          target_label: site
        - target_label: probe_tier
          replacement: internal
