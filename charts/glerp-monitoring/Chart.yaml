# https://green-llama.github.io/helm-charts/
apiVersion: v2
name: glerp-monitoring
description: >
  Unified observability for GLerp RKE2 clusters. Covers uptime/SLA probing (Blackbox
  Exporter), storage utilization (Longhorn, MinIO, DirectPV, node filesystems), and
  security compliance (Trivy CVE scanning, kube-bench CIS, OWASP ZAP). Includes shared
  VictoriaMetrics (90-day retention), unified AlertManager routing, and nine Grafana
  dashboards. New sites auto-discovered by labeling their Kubernetes Service.
type: application
version: 2.4.0
appVersion: "2.4.0"
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: "Heavy app-image scans (glerp-image) now complete: trivy.offlineScan=true + trivy.skipJavaDBUpdate=true. The glerp-image carries a .jar layer (bundled frappe/posawesome tooling); Trivy's Java-DB init failed deterministically in-cluster ('Unable to initialize the Java DB ... chmod /tmp/trivy/.cache/java-db/...: no such file or directory'), so every scan of that layer died AFTER pulling it (the layer downloads to 100% fine). This — not the intermittent HTTP/2 PROTOCOL_ERROR seen earlier — was the real recurring blocker. Verified on dev: gunicorn scan now writes a report (3/3 attempts). Skipping the Java DB is safe for a Python/frappe app (jars are bundled tooling, low runtime surface, same rationale as skipping node_modules); OS + Python packages still scan"
    - kind: added
      description: "Scan only one workload per glerp tenant: skipResourceByLabels=glerp.io/trivy-skip. All 7 glerp pods run the identical glerp-image and the operator has no image-digest dedup, so scanning all 7 pulls the multi-GB image 7x per tenant. The glerp app chart labels the 6 non-gunicorn Deployments to skip them, leaving gunicorn as the single scanned representative (7x fewer pulls per tenant)"
    - kind: changed
      description: "scannerReportTTL 24h -> 168h (weekly). Unchanged images re-pull weekly instead of daily (cuts steady-state bandwidth across a multi-tenant fleet); a new image version still scans immediately on deploy. Re-scans stagger naturally (per-report TTL) + are throttled by concurrency"
    - kind: changed
      description: "scanJobsConcurrentLimit 10 -> 4 to limit concurrent large-layer HTTP/2 image pulls, mitigating 'stream error: PROTOCOL_ERROR received from peer' on the heavy glerp-image layers"
    - kind: fixed
      description: "Heavy app-image scans (glerp-image) no longer time out: skip node_modules (trivy.skipDirs), raise trivy.timeout + scanJobTimeout to 15m, and drop the deprecated trivy.slow flag. The huge frappe/posawesome node_modules tree caused scans to exceed the 5m default and fail silently (context deadline exceeded) with no report written"
    - kind: fixed
      description: "Trivy scan-job throughput: scanJobTTL 1h -> 90s and scanJobsConcurrentLimit 1 -> 10. Completed scan Jobs count against the concurrency limit; at 1h TTL they occupied every slot and starved new scans, so on a full-cluster scan most workloads never got a report and deleting a report didn't regenerate it (looked like the operator was wedged). Root-caused via debug logs"
    - kind: changed
      description: "Upgrade trivy-operator subchart 0.32.1 -> 0.35.0 (app 0.30.1 -> 0.33.0)"
    - kind: fixed
      description: "Bound Trivy vulnerability scan severity so VulnerabilityReport CRDs stay under the Kubernetes 3 MiB object limit — large glerp-image reports at all-5 severities exceeded it, so the CRD was never written (Request entity too large) and the workload silently got no metric and no dashboard data. Severity is configurable; widening past the safe scope risks re-hitting the limit on the heaviest images"
    - kind: removed
      description: "Dead scanJobAdditionalEnvVars/DOCKER_CONFIG scan-job config (invalid subchart key, never rendered) and the unused ghcr-docker-config scan-job volume — Trivy authenticates private scans natively via the workload imagePullSecrets (ghcr-cred)"
keywords:
  - monitoring
  - uptime
  - sla
  - storage
  - longhorn
  - minio
  - directpv
  - security
  - trivy
  - kube-bench
  - owasp-zap
  - glerp
  - erpnext
icon: https://raw.githubusercontent.com/green-llama/helm-charts/main/icons/glerp-monitoring.svg
home: https://github.com/green-llama/k8-glerp-monitoring
sources:
  - https://github.com/green-llama/k8-glerp-monitoring
maintainers:
  - name: Green Llama Technologies
    email: ops@greenllama.tech
dependencies:
  - name: prometheus-blackbox-exporter
    version: "9.4.0"
    repository: https://prometheus-community.github.io/helm-charts
    alias: blackbox-exporter
    condition: blackbox-exporter.enabled
  - name: trivy-operator
    version: "0.35.0"
    repository: https://aquasecurity.github.io/helm-charts/
    condition: trivy-operator.enabled
  - name: prometheus-pushgateway
    version: "2.14.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus-pushgateway.enabled
