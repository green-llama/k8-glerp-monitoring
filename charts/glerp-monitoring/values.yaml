# glerp-monitoring v2 chart values.
# Override these in the Rancher GUI when installing the chart.
# All cluster-specific settings are here — no values are hardcoded in templates.

# ── Cluster identity ──────────────────────────────────────────────────────────
cluster:
  # Human-readable name used in alert annotations and dashboard titles.
  name: gl-dev2
  # Base domain. Sites probed at https://<company>.<domain>/login
  domain: greenllama.tech

# ── Namespace created by this chart ──────────────────────────────────────────
# The chart creates this namespace on install and annotates it to survive
# helm uninstall (preserves VictoriaMetrics PVC data).
namespace: glerp-monitoring

# ── Prometheus namespace ───────────────────────────────────────────────────────
# Namespace where Rancher Monitoring's Prometheus runs. The additionalScrapeConfigs
# Secret must live here — Prometheus Operator cannot read secrets cross-namespace.
prometheusNamespace: cattle-monitoring-system

# ── Prometheus Operator selector labels ───────────────────────────────────────
# Rancher Monitoring's Prometheus picks up PrometheusRule and ServiceMonitor
# objects carrying BOTH these labels.
prometheusRuleLabels:
  release: rancher-monitoring
  app: kube-prometheus-stack

# ── Grafana dashboard and datasource import ───────────────────────────────────
# Rancher's Grafana sidecar watches for ConfigMaps with grafana_dashboard="1"
# in the cattle-dashboards namespace. Datasources use grafana_datasource="1".
grafana:
  dashboardLabel: "1"
  datasourceLabel: "1"
  # All nine dashboards (uptime, storage, security) appear in one unified folder.
  folderName: "GLerp Monitoring"
  # Rancher Monitoring watches cattle-dashboards for dashboards.
  dashboardNamespace: cattle-dashboards
  # Datasource ConfigMap namespace — the datasource sidecar watches BOTH
  # cattle-dashboards and cattle-monitoring-system on this cluster.
  datasourceNamespace: cattle-monitoring-system

# ── VictoriaMetrics — shared long-term storage ────────────────────────────────
# Single shared instance for all GLerp projects. Receives filtered metrics via
# Prometheus remoteWrite and retains them for 90 days.
#
# ONE-TIME post-install step required in Rancher UI
# (Apps → rancher-monitoring → Edit → prometheus.prometheusSpec):
#
#   remoteWrite:
#     - url: http://<release-name>-victoriametrics.<namespace>.svc:8428/api/v1/write
#       writeRelabelConfigs:
#         - sourceLabels: [__name__]
#           regex: "node_filesystem.*|node_uname_info|longhorn.*|minio.*|directpv.*|kube_customresource_directpv.*|kube_persistentvolume.*|kube_persistentvolumeclaim.*|kubelet_volume_stats.*|glerp:.*|probe_.*|glerp_maintenance.*|trivy_.*|kube_bench_.*|zap_.*"
#           action: keep
#
# This filter prevents VictoriaMetrics from receiving all cluster metrics.
victoriaMetrics:
  enabled: true
  imageTag: "v1.101.0"
  # How long to retain metrics. 90d covers 3 SLA reporting months.
  retention: 90d
  storage:
    size: 5Gi
    # StorageClass for the VictoriaMetrics PVC.
    storageClass: "longhorn"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── Internet connectivity probes ───────────────────────────────────────────────
# Three distinct external endpoints for ISP health detection.
# A majority failure (>= 2 of 3) triggers ISPConnectivityLost alert.
internetProbes:
  targets:
    - https://www.google.com
    - https://www.cloudflare.com
    - https://www.microsoft.com

# ── Alert thresholds ───────────────────────────────────────────────────────────
alerts:
  # ── Uptime / SLA ─────────────────────────────────────────────────────────────
  # Minutes before a complete outage fires GLerpSiteDown (critical)
  siteDownMinutes: 2
  # Minutes before a degraded login page fires GLerpSiteDegraded (warning)
  siteDegradedMinutes: 5
  # Minutes before ISPConnectivityLost fires
  ispDownMinutes: 2
  # Fraction of internet probes that must fail to declare ISP down (0.5 = majority)
  ispFailureThreshold: "0.5"

  # ── Storage ──────────────────────────────────────────────────────────────────
  # Longhorn node-level thresholds (% of node storage used)
  longhornNodeWarningPct: 80
  longhornNodeCriticalPct: 90
  # Per-customer Longhorn allotment thresholds (% of quota used)
  customerLonghornWarningPct: 80
  customerLonghornCriticalPct: 100
  # Per-customer MinIO usable capacity thresholds (% of usable used)
  minioUsageWarningPct: 80
  minioUsageCriticalPct: 95
  # DirectPV drive-level thresholds
  directpvDriveWarningPct: 80
  # Node filesystem thresholds (% of filesystem used, non-tmpfs)
  nodeFilesystemWarningPct: 80
  nodeFilesystemCriticalPct: 90

# ── SLA target ─────────────────────────────────────────────────────────────────
sla:
  # Uptime percentage target (used for dashboard threshold coloring and SLA table)
  targetPercent: 99.5

# ── Maintenance Window Admin ───────────────────────────────────────────────────
# Optional browser-based tool for defining maintenance windows.
# Writes glerp_maintenance_window metric to VictoriaMetrics, creates a Grafana
# annotation, and creates an AlertManager silence — all in one form submission.
#
# One-time setup (ops team):
#   1. Create a Grafana service account token (Editor role):
#      Grafana → Administration → Service accounts → Add service account token
#   2. Set grafanaToken, auth.password, and hostname below
#   3. helm upgrade with maintenanceAdmin.enabled: true
maintenanceAdmin:
  enabled: false
  # External hostname for the admin form (bare DNS name, no port).
  hostname: ""
  # External DNS target for automatic Cloudflare DNS record creation.
  externalDnsTarget: ""
  # External port when served on a non-standard HTTPS port (e.g. "10443" for dev).
  port: ""
  # Internal Grafana URL (default works with Rancher Monitoring)
  grafanaUrl: "http://rancher-monitoring-grafana.cattle-monitoring-system.svc.cluster.local"
  # Grafana service account token with Editor role — REQUIRED when enabled
  grafanaToken: ""
  # Internal AlertManager URL (default works with Rancher Monitoring)
  alertmanagerUrl: "http://rancher-monitoring-alertmanager.cattle-monitoring-system.svc.cluster.local:9093"
  auth:
    username: "admin"
    # Set a strong password — this is the only protection for the admin form
    password: ""
  # TLS Secret in traefik-system holding the wildcard cert.
  tlsSecretName: "letsencrypt-greenllama-tech-tls"
  # Google MFA middleware reference (must exist in traefik-system).
  googleMfaMiddleware:
    name: "google-mfa"
    namespace: "traefik-system"

# ── Longhorn storage monitoring ────────────────────────────────────────────────
# Longhorn manager exposes Prometheus metrics on port 9500 at /metrics.
# This chart creates a ServiceMonitor targeting the longhorn-manager service.
longhorn:
  enabled: true
  # Namespace where Longhorn is deployed.
  namespace: longhorn-system
  serviceMonitor:
    scrapeInterval: "60s"
    scrapeTimeout: "30s"

# ── DirectPV storage monitoring ────────────────────────────────────────────────
# DirectPV is MinIO's CSI driver for direct-attached storage.
directpv:
  enabled: true
  # Namespace where DirectPV is deployed.
  namespace: directpv
  # Pod selector for the node-server DaemonSet. Get it with:
  #   kubectl get daemonset node-server -n directpv \
  #     -o jsonpath='{.spec.selector.matchLabels}' --request-timeout=5s
  podSelectorKey: "selector.directpv.min.io"
  podSelectorValue: ""
  serviceMonitor:
    scrapeInterval: "60s"
    scrapeTimeout: "30s"

# ── Customer list ──────────────────────────────────────────────────────────────
# OPTIONAL — only needed if you want per-customer Longhorn soft-cap quota alerts.
# MinIO metrics are auto-discovered cluster-wide; customers do NOT need to be
# listed here for MinIO scraping to work.
#
# Each entry creates optional Longhorn soft-cap quota recording rules
# (glerp:storage_quota_gi) which drive CustomerLonghornQuota alerts.
# Customers without a quotaGi.longhorn value use auto-detected PVC capacity.
#
# IMPORTANT: Lists do NOT merge across override files — the entire list is
# replaced by the override. Document all customers in one values file.
customers: []
# Example:
#  - name: "Acme Corp"         # display name in alerts and dashboard labels
#    slug: "acme"              # short slug for label values (no spaces)
#    namespace: "acme.greenllama.tech"  # exact Kubernetes namespace name
#    quotaGi:
#      longhorn: null          # null = auto-detect from PVC sizes; number = soft cap in Gi

# ── Capacity planning predictive alerts (FUTURE — not yet implemented) ─────────
# The Capacity Planning & Growth dashboard already shows projected days-to-threshold
# per storage object. This stub reserves the config shape for a future predictive
# ALERT (fires when an object is projected to hit its threshold within N days).
# It is NOT wired to any template yet — see README "Future Enhancement: Predictive
# Capacity Alerts" for the implementation blueprint. Leave commented until built.
# capacityPlanning:
#   predictiveAlerts:
#     enabled: false
#     # Per-plane overrides — alert when projected days-to-threshold drops below `days`.
#     planes:
#       longhornNode:    { enabled: false, days: 30, severity: warning }
#       minioTenant:     { enabled: false, days: 30, severity: warning }
#       directpvNode:    { enabled: false, days: 30, severity: warning }
#       nodeFilesystem:  { enabled: false, days: 30, severity: warning }
#       customerQuota:   { enabled: false, days: 14, severity: critical }  # e.g. customer DB space

# ── Security scanning ─────────────────────────────────────────────────────────
# PriorityClass for scan jobs — preempted first under node pressure.
scanPriorityClassName: "glerp-scan-low"

# Report server hostname and ingress configuration.
# SECURITY NOTE: The report server uses FileBrowser with --noauth (authentication is
# handled at the Traefik layer via the googleMfaMiddleware). If you expose reportHostname
# without an authenticating middleware in front of it, all security audit reports
# (kube-bench, ZAP findings) will be publicly readable. Always configure an auth
# middleware at the IngressRoute level before exposing to the internet.
reportHostname: ""            # e.g. security.greenllama.tech
reportPort: ""                # non-standard HTTPS port only (e.g. "10443" for dev); blank = 443
externalDnsTarget: ""         # e.g. pec.greenllama.tech — triggers external-dns Cloudflare record
ingressEntrypoint: "websecure"
ingressNamespace: "traefik-system"

# GLerp web app scan targets — one ZAP CronJob created per entry.
scanTargets: []
# Example:
#  - name: backuptest
#    url: "https://backuptest.dev.greenllama.tech:10443"

# ── kube-bench — CIS Kubernetes Benchmark ─────────────────────────────────────
kubeBench:
  enabled: false
  image: "aquasec/kube-bench:v0.15.0"
  imagePullPolicy: IfNotPresent
  schedule: "0 3 * * 0"       # Weekly: Sunday 03:00 UTC
  benchmark: "rke2-cis-1.7"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ── OWASP ZAP — web application scan ─────────────────────────────────────────
zapScan:
  enabled: false
  image: "ghcr.io/zaproxy/zaproxy:stable"
  imagePullPolicy: IfNotPresent
  schedule: "0 2 * * 0"       # Weekly: Sunday 02:00 UTC
  scanType: "baseline"         # baseline = passive; full = active attack probes
  exitOnWarning: false
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# ── Reports storage and server ────────────────────────────────────────────────
reports:
  storageSize: "10Gi"
  storageClassName: ""         # blank = cluster default (longhorn)
  accessMode: ReadWriteMany    # RWX required — report-server and scan jobs mount simultaneously
  retentionDays: 90
  cleanup:
    enabled: true
    schedule: "0 4 * * *"     # Daily at 04:00 UTC

reportServer:
  image: "filebrowser/filebrowser:v2"
  imagePullPolicy: IfNotPresent
  replicas: 1
  branding:
    name: "GLerp Security Reports"
    color: "#27B093"           # GL Mint Green
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"

# ── GHCR private registry auth (via ESO + Vault) ─────────────────────────────
# Conforms to the shared GHCR pull-secret standard (matches glerp / k8-glerp-ai-intake):
# reads the shared Vault path secret/data/github/ghcr-cred via the vault-backend
# ClusterSecretStore and creates a kubernetes.io/dockerconfigjson secret named
# "ghcr-cred". This chart's own pods use only public images; the secret exists so
# Trivy Operator can SCAN private ghcr.io/green-llama images. Trivy needs the secret
# in every namespace that holds private images, so a ClusterExternalSecret fans it out
# to namespaces labeled glerp.io/private-registry=true (a deliberate deviation from the
# single-namespace standard — required for cross-namespace scanning).
ghcrRegistryAuth:
  enabled: false
  secretName: "ghcr-cred"
  eso:
    enabled: false
    createResources: false
    # Shared Vault-backed store (already exists cluster-wide; do NOT self-create).
    clusterSecretStoreName: "vault-backend"
    # Vault KV path and property holding the base64 dockerconfigjson value.
    vaultKey: "secret/data/github/ghcr-cred"
    vaultProperty: "config"
    clusterExternalSecret:
      enabled: false
      namespaceSelector:
        matchLabels:
          glerp.io/private-registry: "true"

# ── AlertManager receivers ────────────────────────────────────────────────────
# Unified configuration — all alert types (uptime, storage, security) route here.
alertmanager:
  email:
    smarthost: "smtp.example.com:587"
    from: "alerts@greenllama.tech"
    # Recipient(s) — comma-separated for multiple
    to: "alerts@greenllama.tech"
    authUsername: "alerts@greenllama.tech"
    # Pre-create this Secret before installing the chart. It MUST live in the
    # Rancher Monitoring namespace (prometheusNamespace, default
    # cattle-monitoring-system) — the AlertmanagerConfig is deployed there and
    # Prometheus Operator can only read secrets in the config's own namespace:
    #   kubectl create secret generic alertmanager-smtp-secret \
    #     --namespace cattle-monitoring-system \
    #     --from-literal=smtp_auth_password='YOUR_PASSWORD'
    passwordSecret:
      name: alertmanager-smtp-secret
      key: smtp_auth_password
    requireTLS: true

  # ── Telegram (optional) ─────────────────────────────────────────────────────
  telegram:
    enabled: false
    chatId: 0
    # Pre-create in the Rancher Monitoring namespace (cattle-monitoring-system):
    #   kubectl create secret generic telegram-alertmanager-secret \
    #     --namespace cattle-monitoring-system --from-literal=bot_token='YOUR_BOT_TOKEN'
    botTokenSecret:
      name: telegram-alertmanager-secret
      key: bot_token

  # ── Slack (optional) ────────────────────────────────────────────────────────
  slack:
    enabled: false
    channel: "#alerts"
    # Pre-create in the Rancher Monitoring namespace (cattle-monitoring-system):
    #   kubectl create secret generic slack-alertmanager-secret \
    #     --namespace cattle-monitoring-system --from-literal=webhook_url='YOUR_WEBHOOK_URL'
    webhookSecret:
      name: slack-alertmanager-secret
      key: webhook_url

# ── Blackbox Exporter subchart values ─────────────────────────────────────────
blackbox-exporter:
  enabled: true

  image:
    tag: v0.25.0

  service:
    type: ClusterIP
    port: 9115

  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 15s

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    allowPrivilegeEscalation: false
    capabilities:
      add:
        - NET_RAW

  podSecurityContext:
    sysctls:
      - name: net.ipv4.ping_group_range
        value: "0 2147483647"

  config:
    modules:
      # ── Tier 1: Basic HTTPS reachability ─────────────────────────────────────
      http_2xx:
        prober: http
        timeout: 10s
        http:
          valid_status_codes: [200, 301, 302]
          method: GET
          follow_redirects: true
          preferred_ip_protocol: ip4
          tls_config:
            insecure_skip_verify: false

      # ── Tier 2: ERPNext v16 login page content validation ─────────────────────
      http_glerp_login:
        prober: http
        timeout: 10s
        http:
          valid_status_codes: [200]
          method: GET
          follow_redirects: true
          preferred_ip_protocol: ip4
          fail_if_body_not_matches_regexp:
            - 'frappe'
            - 'form-signin'
            - 'btn-login'
          fail_if_header_not_matches:
            - header: Content-Type
              regexp: 'text/html'
          tls_config:
            insecure_skip_verify: false

      # ── Internal Frappe worker health (diagnostic) ────────────────────────────
      http_2xx_internal:
        prober: http
        timeout: 5s
        http:
          valid_status_codes: [200]
          method: GET
          follow_redirects: false
          preferred_ip_protocol: ip4
          fail_if_body_not_matches_regexp:
            - '"message"'

      # ── Internet / ISP connectivity check ────────────────────────────────────
      http_internet:
        prober: http
        timeout: 10s
        http:
          valid_status_codes: [200, 301, 302]
          method: GET
          follow_redirects: true
          preferred_ip_protocol: ip4

# ── Trivy Operator subchart ───────────────────────────────────────────────────
# Continuous container image vulnerability scanning. ClientServer mode with
# shared trivy-server StatefulSet on a Longhorn PVC.
trivy-operator:
  enabled: false
  targetNamespaces: ""
  excludeNamespaces: "kube-system,kube-public,kube-node-lease,cattle-system,cattle-webhook-system,cattle-fleet-system,cattle-fleet-local-system,cattle-provisioning-capi-system,cattle-monitoring-system,cattle-logging-system,cattle-alerting-system,cattle-dashboards,cattle-impersonation-system,fleet-local,fleet-default,rancher-operator-system,traefik-system,cert-manager,longhorn-system,external-secrets,glerp-monitoring"
  operator:
    builtInTrivyServer: true
    # Job-level timeout — must be >= trivy.timeout (below) or the Job is killed before
    # Trivy finishes. Raised to 15m for heavy app images (large frappe/node_modules trees).
    scanJobTimeout: "15m"
    # ── Concurrency + job TTL: the two settings that govern scan THROUGHPUT ────────
    # The operator counts EXISTING scan Jobs (running AND recently-completed) against
    # scanJobsConcurrentLimit. A scan itself takes only ~5s, but if completed Jobs
    # linger (scanJobTTL), they keep occupying concurrency slots and STARVE new scans
    # — the operator logs "Checking scan jobs limit {count: N, limit: N} / Pushing back".
    # On a full-cluster scan (100+ workloads) this manifested as permanent partial
    # coverage that looked like the operator was "wedged": most workloads never scanned,
    # deleting a report didn't regenerate it (no free slot). Root-caused via debug logs
    # (OPERATOR_LOG_DEV_MODE). Fix = keep completed Jobs short-lived so slots free fast,
    # AND give enough concurrency to drain the cluster-wide queue.
    #   - scanJobTTL 90s: completed Jobs clear quickly (frees slots); still leaves a
    #     short forensic window to inspect a failed scan job. (Was 1h — the starvation.)
    #   - scanJobsConcurrentLimit 4: enough to drain the queue (small public-image scans
    #     finish in ~5s), but low enough to LIMIT concurrent large-layer image pulls. The
    #     heavy glerp-image layer pulls over HTTP/2 to GHCR hit
    #     "stream error: PROTOCOL_ERROR received from peer" under concurrency; capping
    #     parallel scans spreads those pulls and mitigates it (alongside gunicorn-only +
    #     7-day TTL cutting glerp scan volume). Was 10 during full-cluster-drain tuning;
    #     lowered to 4 as belt-and-suspenders against the HTTP/2 layer-pull resets.
    scanJobsConcurrentLimit: 4
    scanJobTTL: "90s"
    vulnerabilityScannerEnabled: true
    configAuditScannerEnabled: false
    rbacAssessmentScannerEnabled: false
    exposedSecretScannerEnabled: false
    complianceScannerEnabled: false
    infraAssessmentScannerEnabled: false
    # VulnerabilityReport validity: after this TTL the operator re-scans the workload.
    # 168h (7 days) — the operator has NO image-digest dedup, so the same image version
    # is re-pulled per workload on every re-scan. A weekly interval keeps steady-state
    # image-pull bandwidth low across a multi-tenant fleet running a common glerp-image,
    # while a NEW image version still scans immediately on deploy (workload-change event,
    # TTL-independent). Re-scans stagger naturally: TTL is per-report (keyed to each
    # report's own creation time), and scanJobsConcurrentLimit caps parallelism — so no
    # thundering-herd of pulls on any single day. Trivy's own DB refresh still catches
    # newly-disclosed CVEs against unchanged images at the weekly re-scan.
    scannerReportTTL: "168h"
  trivy:
    mode: ClientServer
    storageClassName: ""
    storageSize: "4Gi"
    skipJavaDBUpdate: false
    ignoreUnfixed: true
    # ── CRITICAL CONSTRAINT: keep VulnerabilityReport CRDs under the K8s 3 MiB limit ──
    # A VulnerabilityReport is a single Kubernetes object; the API server rejects any
    # object > 3 MiB (3145728 bytes). A full app image (OS + Python stack, e.g.
    # glerp-image) scanned across all 5 severities produces a report EXCEEDING 3 MiB, so
    # the operator's job reconciler fails "Request entity too large" and NO report is
    # written — silently: the scan completes but nothing is stored, so the workload gets
    # no metric and no dashboard data. (Confirmed on both dev and prod: only the lighter
    # workloads' reports stored; the heavy ones were silently missing for months.)
    #
    # severity is the ONLY lever on CRD size (there is no summary-only mode for vuln
    # reports; alternateReportStorage replaces CRDs and would break the CRD-derived
    # metric). HIGH,CRITICAL keeps reports well under the limit AND matches the security
    # dashboard's Fixable C+H density (SOC2 CC6.6). Full per-CVE detail for any image is
    # available on demand: kubectl get vulnerabilityreport <name> -n <ns> -o json | jq
    #
    # CONFIGURABLE — a security group may widen this, BUT widening past the safe scope
    # will re-trigger the 3 MiB failure on the heaviest images (they silently stop
    # reporting). If broader coverage with full detail is needed, see the Phase 2
    # FileBrowser offload (webhookBroadcastURL + receiver) noted in the chart docs.
    severity: "HIGH,CRITICAL"
    # ── Heavy-image scan tuning (large frappe/node_modules trees) ─────────────────
    # Full app images (glerp-image) carry a huge node_modules tree (posawesome frontend
    # + frappe apps = thousands of package.json files). At the default 5m timeout Trivy
    # times out mid-analysis ("context deadline exceeded") and the scan FAILS with no
    # report — silently. Two coordinated fixes:
    #   - skipDirs: skip node_modules everywhere. These are built/bundled frontend deps
    #     (low runtime attack surface); skipping them makes scans fast and keeps the real
    #     patchable surface (OS + Python/frappe). GLOBAL — applies to every image, no
    #     per-image/per-namespace management. (Comma-separated dir list; glob supported.)
    #   - timeout 15m + slow:false: safety margin so even a heavy image finishes, and drop
    #     the deprecated `slow` flag (it deliberately runs SLOWER, worsening the timeout).
    # NOTE: scanJobTimeout (operator, above) must be >= this trivy.timeout.
    skipDirs: "**/node_modules"
    timeout: "15m0s"
    slow: false
    priorityClassName: "glerp-scan-low"
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    server:
      resources:
        requests:
          cpu: "200m"
          memory: "512Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  serviceMonitor:
    enabled: true
  trivyOperator:
    scanJobPodPriorityClassName: "glerp-scan-low"
    scanJobAnnotations: ""
    scanJobNodeSelector: {}
    scanJobTolerations: []
    # Scan only ONE workload per glerp tenant. All 7 glerp pods run the IDENTICAL
    # glerp-image, and the operator has no image-digest dedup — so scanning all 7 pulls
    # the same multi-GB image 7× per tenant. skipResourceByLabels skips any workload
    # carrying this label KEY (matches on key presence, not value). The glerp APP chart
    # labels the 6 non-gunicorn Deployments (nginx, socketio, scheduler, worker-d/l/s)
    # with `glerp.io/trivy-skip: "true"`, leaving gunicorn as the single scanned
    # representative. Harmless if the label doesn't exist yet (nothing gets skipped).
    skipResourceByLabels: "glerp.io/trivy-skip"
    # NOTE: no scan-job DOCKER_CONFIG volume/env here on purpose. Trivy Operator
    # authenticates private-registry scans NATIVELY from each workload's
    # imagePullSecrets (ghcr-cred) — verified working. The former
    # scanJobCustomVolumes(ghcr-docker-config) + scanJobAdditionalEnvVars(DOCKER_CONFIG)
    # approach was dead config: scanJobAdditionalEnvVars is not a valid subchart key
    # (never rendered), so DOCKER_CONFIG was never set and the mounted secret was never
    # read. Removed to avoid confusion.

# ── Prometheus Pushgateway subchart ──────────────────────────────────────────
# Receives metrics pushes from kube-bench and ZAP scan jobs.
prometheus-pushgateway:
  replicaCount: 1
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  serviceMonitor:
    enabled: true
    namespace: ""
  # Persist the pushed metrics to disk. kube-bench/ZAP only run weekly, so without
  # persistence a Pushgateway pod restart wipes all pushed metrics and the security
  # dashboard shows 0s until the next Sunday run. --persistence.file (below) writes
  # the in-memory store to this PVC every 5m and reloads it on startup.
  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    mountPath: /data
    size: 256Mi
  extraArgs:
    - --persistence.file=/data/pushgateway.store
    - --persistence.interval=5m
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"
