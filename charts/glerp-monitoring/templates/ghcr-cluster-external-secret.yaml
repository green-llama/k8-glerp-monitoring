{{- if and .Values.ghcrRegistryAuth.enabled .Values.ghcrRegistryAuth.eso.enabled .Values.ghcrRegistryAuth.eso.createResources .Values.ghcrRegistryAuth.eso.clusterExternalSecret.enabled }}
{{- /*
Fans the shared GHCR pull secret out to every namespace matching the selector so
Trivy Operator can scan private ghcr.io/green-llama images there. Reads the shared
Vault path via the vault-backend ClusterSecretStore and templates the base64
dockerconfigjson (Vault property "config") into a kubernetes.io/dockerconfigjson
secret named "ghcr-cred" — matching the glerp / k8-glerp-ai-intake standard.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ .Values.ghcrRegistryAuth.secretName }}
  labels:
    {{- include "glerp-monitoring.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    {{- toYaml .Values.ghcrRegistryAuth.eso.clusterExternalSecret.namespaceSelector | nindent 4 }}
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: {{ required "ghcrRegistryAuth.eso.clusterSecretStoreName is required when clusterExternalSecret.enabled=true" .Values.ghcrRegistryAuth.eso.clusterSecretStoreName }}
      kind: ClusterSecretStore
    target:
      name: {{ .Values.ghcrRegistryAuth.secretName }}
      creationPolicy: Owner
      deletionPolicy: Retain
      template:
        engineVersion: v2
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: "{{ `{{ .config }}` }}"
    data:
      - secretKey: config
        remoteRef:
          key: {{ .Values.ghcrRegistryAuth.eso.vaultKey | quote }}
          property: {{ .Values.ghcrRegistryAuth.eso.vaultProperty | quote }}
{{- end }}
