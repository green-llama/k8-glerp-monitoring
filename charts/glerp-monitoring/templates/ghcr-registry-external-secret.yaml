{{- if and .Values.ghcrRegistryAuth.enabled .Values.ghcrRegistryAuth.eso.enabled .Values.ghcrRegistryAuth.eso.createResources }}
{{- /*
Creates the shared GHCR pull secret (ghcr-cred) in this release's namespace from the
shared Vault path via the vault-backend ClusterSecretStore — matching the glerp /
k8-glerp-ai-intake standard (config property -> .dockerconfigjson template).
The cross-namespace fan-out for Trivy scanning is handled separately by
ghcr-cluster-external-secret.yaml (ClusterExternalSecret).
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.ghcrRegistryAuth.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "glerp-monitoring.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ required "ghcrRegistryAuth.eso.clusterSecretStoreName is required when eso.createResources=true" .Values.ghcrRegistryAuth.eso.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.ghcrRegistryAuth.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ `{{ .config }}` }}"
  data:
    - secretKey: config
      remoteRef:
        key: {{ .Values.ghcrRegistryAuth.eso.vaultKey | quote }}
        property: {{ .Values.ghcrRegistryAuth.eso.vaultProperty | quote }}
{{- end }}
